<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../usa%20logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080d18;
    --bg-2: #0d1526;
    --surface: #111c30;
    --surface-2: #16233a;
    --line: rgba(148,163,184,.14);
    --line-strong: rgba(148,163,184,.26);
    --text: #e8eefb;
    --muted: #8698b5;
    --gold: #d9b45b;
    --gold-soft: rgba(217,180,91,.12);
    --green: #4ade80;
    --red: #f87171;
    --radius: 16px;
    --shadow: 0 24px 60px -20px rgba(0,0,0,.75);
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:
      radial-gradient(1000px 520px at 12% -8%, rgba(217,180,91,.10), transparent 62%),
      radial-gradient(900px 520px at 92% 4%, rgba(56,110,190,.16), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4, .stat-n { font-family: 'Sora', sans-serif; letter-spacing: -.015em; }

  /* ---------- Gate ---------- */
  .gate-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
  .gate-card {
    position: relative; width: 100%; max-width: 400px; padding: 2.5rem 2.25rem;
    background: linear-gradient(180deg, rgba(22,35,58,.92), rgba(13,21,38,.92));
    border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow);
    backdrop-filter: blur(14px);
  }
  .gate-card::before {
    content: ''; position: absolute; inset: 0; border-radius: 22px; padding: 1px;
    background: linear-gradient(140deg, rgba(217,180,91,.55), transparent 45%, rgba(148,163,184,.18));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
  }
  .lock-badge {
    width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center;
    background: var(--gold-soft); border: 1px solid rgba(217,180,91,.35); color: var(--gold);
    margin-bottom: 1.35rem;
  }
  .lock-badge svg { width: 24px; height: 24px; }
  .gate-card h1 { margin: 0 0 .45rem; font-size: 1.45rem; font-weight: 700; }
  .gate-card .sub { color: var(--muted); margin: 0 0 1.75rem; font-size: .92rem; line-height: 1.5; }
  .field { position: relative; }
  .field input {
    width: 100%; padding: .9rem 1rem; border-radius: 12px; border: 1px solid var(--line-strong);
    background: rgba(8,13,24,.75); color: var(--text); font-size: 1rem; font-family: inherit;
    transition: border-color .18s, box-shadow .18s;
  }
  .field input::placeholder { color: #5f728e; }
  .field input:focus { outline: none; border-color: rgba(217,180,91,.7); box-shadow: 0 0 0 4px rgba(217,180,91,.12); }
  .btn-primary {
    width: 100%; margin-top: 1rem; padding: .9rem; border: 0; border-radius: 12px;
    background: linear-gradient(180deg, #e6c471, #c99f42); color: #14192a;
    font-family: 'Sora', sans-serif; font-weight: 600; font-size: .98rem; cursor: pointer;
    transition: transform .15s, filter .15s, box-shadow .15s;
    box-shadow: 0 10px 24px -12px rgba(217,180,91,.9);
  }
  .btn-primary:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .err { color: var(--red); font-size: .85rem; margin-top: .8rem; min-height: 1.1em; }
  .gate-foot { margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--line); color: #5f728e; font-size: .78rem; text-align: center; letter-spacing: .04em; text-transform: uppercase; }

  /* ---------- Shell ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 1rem;
    padding: .95rem clamp(1rem, 4vw, 2.5rem);
    background: rgba(8,13,24,.82); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: .8rem; flex: 1; min-width: 0; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0;
    background: linear-gradient(160deg, #e6c471, #b98f34); color: #14192a;
    font-family: 'Sora', sans-serif; font-weight: 700; font-size: .95rem;
  }
  .brand h1 { margin: 0; font-size: 1.02rem; font-weight: 600; }
  .brand .tag { display: block; color: var(--muted); font-size: .74rem; letter-spacing: .09em; text-transform: uppercase; font-family: 'Manrope', sans-serif; }
  .btn-ghost {
    display: inline-flex; align-items: center; gap: .45rem;
    background: rgba(148,163,184,.07); color: #cbd7ea; border: 1px solid var(--line-strong);
    padding: .5rem .9rem; border-radius: 10px; cursor: pointer; font-size: .85rem; font-family: inherit;
    transition: background .15s, border-color .15s, color .15s;
  }
  .btn-ghost:hover { background: rgba(148,163,184,.16); border-color: rgba(217,180,91,.45); color: #fff; }
  .btn-ghost svg { width: 15px; height: 15px; }
  .spin { animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }

  .wrap { padding: clamp(1.25rem, 3vw, 2.25rem) clamp(1rem, 4vw, 2.5rem) 4rem; max-width: 1400px; margin: 0 auto; }

  /* ---------- Stats ---------- */
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .stat {
    position: relative; overflow: hidden;
    background: linear-gradient(180deg, rgba(22,35,58,.85), rgba(13,21,38,.85));
    border: 1px solid var(--line); border-radius: var(--radius); padding: 1.15rem 1.25rem;
  }
  .stat::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: linear-gradient(180deg, var(--gold), transparent); }
  .stat-n { font-size: 2rem; font-weight: 700; color: #fff; line-height: 1.1; }
  .stat-l { color: var(--muted); font-size: .76rem; text-transform: uppercase; letter-spacing: .12em; margin-top: .3rem; }

  /* ---------- Toolbar ---------- */
  .toolbar { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; margin-bottom: 1.25rem; }
  .search { position: relative; flex: 1; min-width: 220px; }
  .search svg { position: absolute; left: .85rem; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
  .search input {
    width: 100%; padding: .72rem 1rem .72rem 2.5rem; border-radius: 12px;
    border: 1px solid var(--line-strong); background: rgba(13,21,38,.8); color: var(--text);
    font-size: .92rem; font-family: inherit;
  }
  .search input:focus { outline: none; border-color: rgba(217,180,91,.6); box-shadow: 0 0 0 4px rgba(217,180,91,.1); }
  .section-title { font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-family: 'Manrope', sans-serif; font-weight: 600; }

  /* ---------- User cards ---------- */
  .user-card {
    background: linear-gradient(180deg, rgba(22,35,58,.75), rgba(13,21,38,.75));
    border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: .9rem; overflow: hidden;
    transition: border-color .18s, box-shadow .18s;
  }
  .user-card[open] { border-color: rgba(217,180,91,.32); box-shadow: 0 18px 40px -26px rgba(0,0,0,.9); }
  .user-card summary { list-style: none; padding: 1rem 1.25rem; display: flex; align-items: center; gap: 1rem; cursor: pointer; }
  .user-card summary::-webkit-details-marker { display: none; }
  .user-card summary:hover { background: rgba(148,163,184,.06); }
  .avatar {
    width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
    display: grid; place-items: center; font-family: 'Sora', sans-serif; font-weight: 700;
    background: linear-gradient(160deg, #e6c471, #b98f34); color: #14192a;
  }
  .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .12rem; }
  .who strong { color: #f4f8ff; font-weight: 600; font-size: .98rem; }
  .muted { color: var(--muted); font-size: .84rem; }
  .who .muted { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge {
    background: var(--gold-soft); color: var(--gold); border: 1px solid rgba(217,180,91,.3);
    padding: .3rem .7rem; border-radius: 999px; font-size: .74rem; font-weight: 600; white-space: nowrap;
  }
  .badge.zero { background: rgba(148,163,184,.08); color: var(--muted); border-color: var(--line-strong); }
  .chev { color: var(--muted); width: 18px; height: 18px; flex-shrink: 0; transition: transform .2s; }
  .user-card[open] .chev { transform: rotate(180deg); }

  .user-body { padding: 0 1.25rem 1.4rem; border-top: 1px solid var(--line); }
  .user-body h3 {
    margin: 1.4rem 0 .85rem; font-size: .76rem; color: var(--gold);
    text-transform: uppercase; letter-spacing: .14em; font-family: 'Manrope', sans-serif; font-weight: 700;
    display: flex; align-items: center; gap: .7rem;
  }
  .user-body h3::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .app-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(255px, 1fr)); gap: .85rem; }
  .block { background: rgba(8,13,24,.6); border: 1px solid var(--line); border-radius: 12px; padding: .95rem 1.05rem; }
  .block h4 { margin: 0 0 .7rem; font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; font-family: 'Manrope', sans-serif; font-weight: 700; }
  .kv { display: flex; justify-content: space-between; gap: 1rem; padding: .4rem 0; border-bottom: 1px solid rgba(148,163,184,.08); font-size: .85rem; }
  .kv:last-child { border-bottom: 0; }
  .k { color: var(--muted); }
  .v { color: #eaf0fb; word-break: break-word; text-align: right; max-width: 62%; font-weight: 500; }
  .empty, .empty-state { color: #5f728e; font-style: italic; padding: .5rem 0; font-size: .88rem; }
  .empty-state {
    padding: 3rem 1.5rem; text-align: center; font-style: normal;
    background: rgba(13,21,38,.6); border: 1px dashed var(--line-strong); border-radius: var(--radius);
  }
  .app { background: rgba(8,13,24,.5); border: 1px solid var(--line); border-radius: 13px; padding: 1.05rem; margin-bottom: .85rem; }
  .app:last-child { margin-bottom: 0; }
  .app-head { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: space-between; align-items: center; margin-bottom: .9rem; padding-bottom: .7rem; border-bottom: 1px solid var(--line); }
  .app-head strong { font-family: 'Sora', sans-serif; font-size: .95rem; }
  @media (max-width: 560px) {
    .user-card summary { gap: .75rem; padding: .9rem 1rem; }
    .brand .tag { display: none; }
    .v { max-width: 55%; }
  }
</style>
</head>
<body>

<div id="gate" class="gate-wrap">
  <form id="gateForm" class="gate-card">
    <div class="lock-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></svg>
    </div>
    <h1>Admin Access</h1>
    <p class="sub">This area is restricted. Enter the admin password to view applicant records.</p>
    <div class="field">
      <input id="pw" type="password" placeholder="Enter password" autocomplete="current-password" autofocus>
    </div>
    <button type="submit" class="btn-primary">Unlock Dashboard</button>
    <div id="pwErr" class="err"></div>
    <div class="gate-foot">Secure Administration Portal</div>
  </form>
</div>

<div id="dash" style="display:none;">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">AD</span>
      <span>
        <h1>Applications Console</h1>
        <span class="tag">Admin Dashboard</span>
      </span>
    </div>
    <button id="refresh" class="btn-ghost">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      Refresh
    </button>
    <button id="signOut" class="btn-ghost">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></svg>
      Lock
    </button>
  </header>

  <div class="wrap">
    <div id="summary" class="summary"></div>
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="Search by name, email, username or phone…">
      </div>
      <span class="section-title" id="resultCount"></span>
    </div>
    <main id="users"></main>
  </div>
</div>

<script type="module" src="../js/admin.js"></script>
</body>
</html>
