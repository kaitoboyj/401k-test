<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../usa%20logo.png">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
  .gate-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
  .gate-card { background: #1e293b; padding: 2.5rem; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.5); width: 100%; max-width: 380px; }
  .gate-card h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
  .gate-card p { color: #94a3b8; margin: 0 0 1.5rem; font-size: .9rem; }
  .gate-card input { width: 100%; padding: .75rem 1rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 1rem; }
  .gate-card input:focus { outline: 2px solid #d4af37; }
  .gate-card button { width: 100%; margin-top: 1rem; padding: .75rem; border: 0; border-radius: 8px; background: #d4af37; color: #0f172a; font-weight: 700; font-size: 1rem; cursor: pointer; }
  .gate-card button:hover { background: #b8941f; }
  .err { color: #f87171; font-size: .85rem; margin-top: .75rem; min-height: 1em; }
  header.topbar { background: #1e293b; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }
  header.topbar h1 { margin: 0; font-size: 1.15rem; }
  header.topbar button { background: transparent; color: #cbd5e1; border: 1px solid #475569; padding: .4rem .9rem; border-radius: 6px; cursor: pointer; font-size: .85rem; }
  header.topbar button:hover { background: #334155; }
  .summary { display: flex; gap: 1rem; padding: 1.5rem 2rem 0; }
  .stat { background: #1e293b; padding: 1rem 1.5rem; border-radius: 10px; border: 1px solid #334155; flex: 1; max-width: 200px; }
  .stat .n { font-size: 1.8rem; font-weight: 700; color: #d4af37; }
  .stat .l { color: #94a3b8; font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; }
  main { padding: 1.5rem 2rem 3rem; }
  .user-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; margin-bottom: 1rem; overflow: hidden; }
  .user-card summary { list-style: none; padding: 1rem 1.25rem; display: flex; align-items: center; gap: 1rem; cursor: pointer; }
  .user-card summary::-webkit-details-marker { display: none; }
  .user-card summary:hover { background: #263449; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: #d4af37; color: #0f172a; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
  .who { flex: 1; display: flex; flex-direction: column; }
  .who strong { color: #f1f5f9; }
  .muted { color: #94a3b8; font-size: .85rem; }
  .badge { background: #334155; color: #cbd5e1; padding: .25rem .65rem; border-radius: 999px; font-size: .75rem; }
  .user-body { padding: 0 1.25rem 1.25rem; border-top: 1px solid #334155; }
  .user-body h3 { margin: 1.25rem 0 .75rem; font-size: 1rem; color: #d4af37; text-transform: uppercase; letter-spacing: .05em; }
  .app-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
  .block { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: .9rem 1rem; }
  .block h4 { margin: 0 0 .6rem; font-size: .8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: .05em; }
  .kv { display: flex; justify-content: space-between; gap: 1rem; padding: .3rem 0; border-bottom: 1px dashed #334155; font-size: .85rem; }
  .kv:last-child { border-bottom: 0; }
  .k { color: #94a3b8; }
  .v { color: #e2e8f0; word-break: break-word; text-align: right; max-width: 60%; }
  .empty, .empty-state { color: #64748b; font-style: italic; padding: .5rem 0; }
  .empty-state { padding: 2rem; text-align: center; }
  .app { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 1rem; margin-bottom: .75rem; }
  .app-head { display: flex; justify-content: space-between; margin-bottom: .75rem; padding-bottom: .5rem; border-bottom: 1px solid #334155; }
</style>
</head>
<body>

<div id="gate" class="gate-wrap">
  <form id="gateForm" class="gate-card">
    <h1>Admin Access</h1>
    <p>Enter the admin password to continue.</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
    <button type="submit">Unlock</button>
    <div id="pwErr" class="err"></div>
  </form>
</div>

<div id="dash" style="display:none;">
  <header class="topbar">
    <h1>Admin Dashboard</h1>
    <button id="signOut">Lock</button>
  </header>
  <div id="summary" class="summary"></div>
  <main id="users"></main>
</div>

<script type="module" src="../js/admin.js"></script>
</body>
</html>
